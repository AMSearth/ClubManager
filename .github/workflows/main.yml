name: ClubManager CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: club_manager
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        extensions: mysqli, pdo_mysql
        tools: phpcs

    - name: Check PHP Syntax (Lint)
      run: |
        find . -name "*.php" -print0 | xargs -0 -n1 php -l

    - name: Validate Database Schema
      run: |
        mysql -h 127.0.0.1 -u root -proot club_manager < database.sql

    # Optional: If you have Composer dependencies, uncomment below
    # - name: Install Dependencies
    #   run: composer install --prefer-dist --no-progress

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Example: Deploy via SSH to your web server
    # You will need to add SECRETS to your GitHub Repository settings
    - name: Deploy to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "."
        target: "/var/www/html/ClubManager"
